/**:
  ros__parameters:
    controller_type: "stanley"
    trajectory_type: "figure8"
    output_file: "test_data/results/stanley_figure8.csv"
    control_frequency: 50.0

    # Vehicle parameters
    wheelbase: 0.22
    max_steering_angle: 0.6109
    max_velocity: 2.0

    # Stanley controller parameters
    stanley:
      k: 5.0              # Cross-track error gain (EVEN MORE AGGRESSIVE for figure8)
      k_s: 0.3            # Softening constant (reduced for sharper response)
      base_velocity: 1.0
      curvature_gain: 2.0 # INCREASED - slow down more on tight curves (figure8)
