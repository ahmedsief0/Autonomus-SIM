/**:
  ros__parameters:
    # Body params (body_length = 0.565m gives wheelbase = body_length - 2*wheel_radius = 0.485m = 485mm)
    body_length: 0.565 # Length of the vehicle's body [m]
    body_width: 0.20 # Width of the vehicle's body [m]
    body_height: 0.05 # Height of the vehicle's body [m]
    body_density: 2500.0 # Density of the vehicle's body material [kg/m^3]

    # Wheel params
    wheel_radius: 0.04 # Radius of each wheel [m]
    wheel_width: 0.025 # Width of each wheel [m]
    wheel_density: 900.0 # Density of the wheel material [kg/m^3]

    # Kinematics and dynamics params
    wheelbase: 0.485 # Explicit vehicle wheelbase: 485 mm = 0.485 m
    max_steering_angle: 0.506145 # Maximum steering angle: 29 degrees = 0.506145 rad
    max_steering_angular_velocity: 3.5 # Maximum steering angular velocity [rad/s]
    max_steering_effort: 25.0 # Maximum steering torque [Nm]
    max_velocity: 4.1667 # Maximum velocity: 15 km/h = 4.1667 m/s
    max_effort: 60.0 # Maximum wheel torque [Nm]

    # Camera and image params
    camera_box_size: 0.05 # Size of the camera enclosure [m]
    camera_stick_size: 0.02 # Size of the camera stick [m]
    camera_height: 0.2 # Height of the camera above the body_link [m]
    camera_pitch: 0.20 # Pitch angle of the camera relative to body_link [rad] (approx 11.5 deg)
    camera_fov: 1.3962634 # Field of view of the camera [rad]
    camera_fps: 30 # Frames per second for camera capture [Hz]
    image_width: 640 # Width of the camera's image output [pixels]
    image_height: 480 # Height of the camera's image output [pixels]
